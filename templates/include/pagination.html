{% load static %}
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>
<div class="pagination">
    <span class="step-links">
        {% if post_list.has_previous %}
            <a href="?page=1" class="btn btn-primary">&laquo; first</a>
            <a href="?page={{ post_list.previous_page_number }}" class="btn btn-primary">previous</a>
        {% endif %}

        <span class="current">
            Page {{ post_list.number }} of {{ post_list.paginator.num_pages }}.
        </span>

        {% if post_list.has_next %}
            <a href="?page={{ post_list.next_page_number }}" class="btn btn-primary">next</a>
            <a href="?page={{ post_list.paginator.num_pages }}" class="btn btn-primary">last &raquo;</a>
        {% endif %}
    </span>
</div>
