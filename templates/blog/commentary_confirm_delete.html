{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-md-6">

    <div class="card shadow">

      <div class="card-header bg-danger text-white">
        Delete comment
      </div>

      <div class="card-body">

        <p>
          Are you sure you want to delete this comment?
        </p>

        <blockquote class="blockquote">
          "{{ object.content }}"
        </blockquote>

        <form method="post">
          {% csrf_token %}

          <button type="submit"
                  class="btn btn-danger">
            Yes, delete
          </button>

          <a href="{% url 'blog:post-detail' pk=object.post.id %}"
             class="btn btn-secondary">
            Cancel
          </a>

        </form>

      </div>

    </div>

  </div>
</div>

{% endblock %}
