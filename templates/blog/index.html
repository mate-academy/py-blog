{% extends "base.html" %}
{% block title %}
  <title>Blog</title>
{% endblock %}
{% block content %}
    <div class="container mt-4">
      <div class="row justify-content-center">
        <div class="col-md-8">
          {% for post in post_list %}
            <div class="card mb-4">
              <div class="card-header">
                {{ post.owner }} at {{ post.created_time }}
              </div>
              <div class="card-body">
                <h3>
                  <a href="{% url 'blog:post-detail' pk=post.id%}" class="text-decoration-none">{{ post.title }}</a>
                </h3>
                <p class="card-text">{{ post.content }}</p>
              </div>
              <div class="card-footer text-muted">
                💬 {{ post.commentary_set.count }} comments
              </div>
            </div>
          {% endfor %}
        </div>
      </div>
    </div>
{% endblock %}
