{% extends "base.html" %}

{% block content %}
<h1>Posts</h1>
<table class="table">
  <tr>
    <th>Title</th>
    <th>Content</th>
    <th>Author</th>
    <th>Created at</th>
    <th>Number of comments</th>
  </tr>
  {% for post in post_list %}
  <tr>
    <td><a href="{% url 'blog:post-detail' pk=post.id %}">{{ post.title }}</a></td>
    <td>{{ post.content }}</td>
    <td>{{ post.owner }}</td>
    <td>{{ post.created_time }}</td>
    <td>{{ post.commentaries.count }}</td>
  </tr>
  {% endfor %}
</table>

{% endblock %}
