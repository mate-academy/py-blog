{% extends 'base.html' %}

{% block content %}
  <h1>All posts</h1>
  {%  if all_posts %}
    {% for post in all_posts %}
      <a href="{% url 'blog:post-detail' pk=post.id %}"><h3>{{ post.title }}</h3></a>
      <p>{{ post.content }}</p>
      <small>{{ post.created_time }}</small>
      <small>{{ post.owner.username }}</small>
      <br>
    {% endfor %}
    {% include 'includes/pagination.html' with post=post %}
  {% endif %}
{% endblock %}
