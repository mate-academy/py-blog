{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <div class="row justify-content-center mt-4">
    <div class="col-md-8 col-lg-6">
      <div class="comment-form-section">
        {% if user.is_authenticated %}
          <h4 class="mb-4">{{ object|yesno:"Update,Add" }} a comment</h4>
          <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="mt-3">
              <button type="submit" class="btn btn-primary">Post comment</button>
              <a href="{% url 'blog:post-detail' pk=object.post.pk|default:view.kwargs.pk %}" class="btn btn-secondary">
                Cancel
              </a>
            </div>
          </form>
        {% endif %}
      </div>
    </div>
  </div>
{% endblock %}
