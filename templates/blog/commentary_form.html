{% extends "base.html" %}

{% load crispy_forms_filters %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-lg-8">

    <div class="card shadow">

      <div class="card-header">
        <h3>Edit comment</h3>
      </div>

      <div class="card-body">

        <form method="post">
          {% csrf_token %}

          {{ form|crispy }}

          <button type="submit"
                  class="btn btn-primary">
            Save
          </button>

          <a href="{% url 'blog:post-detail' pk=object.post.id %}"
             class="btn btn-secondary">
            Cancel
          </a>

        </form>

      </div>

    </div>

  </div>
</div>

{% endblock %}
