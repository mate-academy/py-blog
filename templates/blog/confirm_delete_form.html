{% extends "base.html" %}

{% block content %}
  <p>Are you sure you want to delete your comment?</p>
  <div class="d-flex">
    <form class="mr-2" action="" method="post">
    {% csrf_token %}
    <input class="btn btn-danger" type="submit" value="Yes, delete">
  </form>
  <p>
    {% url 'blog:post-detail' pk=object.post.pk as list_detail %}
    <a class="btn btn-success" href="{{ next|default:list_detail}}">Cancel</a></p>
  </div>
{% endblock %}
