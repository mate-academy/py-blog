{% extends "base.html" %}

{% block content %}
<h1>Post list</h1>
{% if post_list %}
<ul>
  {% for post in post_list %}
  <li>
    <a href="{% url 'blog:post-detail' pk=post.id %}">
      {{ post.id }}
      {{ post.title }}
    </a>
  </li>
  {% endfor %}
</ul>
{% else %}
<p>There are no post in blog</p>
{% endif %}

{% endblock %}
