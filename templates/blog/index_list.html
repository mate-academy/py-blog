{% extends "base.html" %}

{% block content %}
  <h1>Blog System Home</h1>
  <div class="card mb-4">
    {% for post in post_list %}
    <div class="card-body">
      <h2 class="card-title">
        <a href="{% url 'blog:post-detail' pk=post.id %}" class="card-link text-decoration-none">{{ post.title }}</a>
      </h2>
      <hr>
      <p class="card-text">{{ post.content }}</p>
      <div class="card-footer text-muted d-flex justify-content-between">
        <span>By {{ post.owner }}</span>
        <span class="text-muted">{{ post.created_time }}</span>
        <span>Comments: {{ post.comments.count }}</span>
      </div>
    </div>
    {% endfor %}
  </div>
{% endblock %}
