
{% for post in posts %}
    <div class="card mb-4 shadow-sm">

        <div class="card-body">

            <h3 class="card-title">
                {{ post.title }}
            </h3>

            <p class="text-muted">
                {{ post.created_time }} • {{ post.owner }}
            </p>

            <p class="card-text">
                {{ post.content|truncatechars:150 }}
            </p>

            <a href="{% url 'blog:post-detail' post.id %}" class="btn btn-dark btn-sm">
                Read more
            </a>

        </div>
    </div>
{% endfor %}
