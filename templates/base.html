<!DOCTYPE html>
<html lang="en">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% load static %}

  {% block title %}<title>Blog</title>{% endblock %}
</head>

<body>

    {% block pagination %}

    <br>

  </div>
</body>

</html>
