{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}The Blog{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'blog:index' %}">The Blog<span>Ideas worth sharing.</span></a>
    <nav aria-label="Account">
      {% if user.is_authenticated %}
        <span>{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-outline-dark">Log out</button></form>
      {% else %}
        <a href="{% url 'login' %}?next={{ request.path|urlencode }}">Log in</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>A place for curious minds.</footer>
</body>
</html>
