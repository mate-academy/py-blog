<!DOCTYPE html>
{% load static %}
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Blog{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="{% url 'blog:index' %}">
      <i class="bi bi-journal-text me-2"></i>Blog
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link active" href="{% url 'blog:index' %}">Main</a>
        </li>
      </ul>
      <div class="d-flex align-items-center">
        {% if user.is_authenticated %}
          <span class="navbar-text me-3">
                            <i class="bi bi-person-circle me-1"></i>{{ user.username }}
                        </span>
          <a href="{% url 'admin:index' %}" class="btn btn-outline-light btn-sm me-2">Admin Panel</a>
        {% else %}
          <a href="{% url 'admin:login' %}" class="btn btn-primary btn-sm">Login</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>

<main class="container my-4 flex-grow-1 main-content">
  {% block content %}
  {% endblock %}
  <br>
  {% block pagination %}
  {% endblock %}
</main>

<footer class="bg-dark text-white py-4 mt-auto">
  <div class="container text-center">
    <p class="mb-0 text-white-50">&copy; {% now "Y" %} Blog</p>
  </div>
</footer>

</body>
</html>
