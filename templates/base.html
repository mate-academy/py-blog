{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}The Python Journal{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
  <header class="site-header">
    <nav class="container nav-content" aria-label="Main navigation">
      <a class="brand" href="{% url 'blog:index' %}">
        <span class="brand-mark">Py</span>
        <span>The Python Journal</span>
      </a>
      <div class="account-links">
        {% if user.is_authenticated %}
          <span class="welcome">Hello, {{ user.username }}</span>
          <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button class="link-button" type="submit">Log out</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}?next={{ request.path }}">Log in</a>
        {% endif %}
      </div>
    </nav>
  </header>

  <main class="container page-shell">
    {% block content %}{% endblock %}
  </main>

  <footer class="container site-footer">
    Notes on Python, Django, and the craft of building software.
  </footer>
</body>
</html>
