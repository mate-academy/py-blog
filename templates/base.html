{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Blog{% endblock %}</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
  >
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'blog:index' %}">Blog</a>
    <div class="ml-auto">
      {% if user.is_authenticated %}
        <span class="navbar-text text-light mr-3">{{ user.username }}</span>
        <a href="{% url 'admin:index' %}" class="btn btn-outline-light btn-sm">Admin</a>
      {% else %}
        <a href="{% url 'admin:index' %}" class="btn btn-outline-light btn-sm">Log in</a>
      {% endif %}
    </div>
  </div>
</nav>

<div class="container">
  {% block content %}{% endblock %}
</div>

<footer class="text-center text-muted py-4 mt-5 border-top">
  <small>&copy; 2026 Blog</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
