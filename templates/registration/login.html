{% extends "base.html" %}
{% load crispy_forms_filters %}
{% block content %}
  <div class="max-w-lg mx-auto">
    <form action="{% url 'login' %}" method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <input type="submit" value="login" class="btn btn-primary">
      <input type="hidden" name="next" value="{{ next }}">
    </form>
  </div>
{% endblock %}
