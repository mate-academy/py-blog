{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block sidebar %}{% endblock %}

{% block content %}

<div class="mt-4" style="max-width: 400px;">

  <h3>Login</h3>

  {% if form.errors %}
    <div class="alert alert-danger">
      Invalid credentials
    </div>
  {% endif %}

  <form method="post">
    {% csrf_token %}

    {{ form|crispy }}

    <button class="btn btn-outline-dark mt-2">
      Login
    </button>

    <input type="hidden" name="next" value="{{ next }}">
  </form>

</div>

{% endblock %}
