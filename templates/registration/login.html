{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}

{% if form.errors %}
<p>{{form.errors}}</p>
{% endif %}

<form method="post">
  {% csrf_token %}
  {{ form|crispy }}

  <input type="submit" value="login">
  <input type="hidden" name="next" value="{{ next }}">
</form>

{% endblock %}
