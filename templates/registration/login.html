{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Logowanie - Py-Blog{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 c-login-card">
            <div class="card-body p-5">
                <h2 class="text-center mb-4 fw-bold c-login-card__title">Zaloguj się</h2>

                <form method="post" class="c-login-form">
                    {% csrf_token %}

                    {{ form|crispy }}

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg c-login-form__submit">
                            Zaloguj
                        </button>
                    </div>
                </form>

                <div class="mt-4 text-center">
                    <p class="text-muted small">
                        Nie masz konta? Skontaktuj się z administratorem.
                    </p>
                    <a href="{% url 'blog:index' %}" class="text-decoration-none small">&larr; Powrót do bloga</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
