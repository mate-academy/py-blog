{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Log in to IT Blogs{% endblock %}

{% block content %}
  <h2>Login</h2>

  <form method="post" novalidate class="w-50">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
{% endblock %}
