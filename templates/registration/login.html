{% extends "base.html" %}
{% block content %}
  <h1 class="mt-4 text-center">Login</h1>
  {% if form.errors %}
    <p class="text-center" style="color: red">Invalid credentials</p>
  {% endif %}
  <form class="text-center" action="{% url 'login' %}" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input class="btn btn-success" type="submit" value="Submit">
    <input type="hidden" name="next" value="{{ next }}">
  </form>
{% endblock %}
