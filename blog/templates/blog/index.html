<!DOCTYPE html>
<html>
<head>
    <title>Blog</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <h1>Blog</h1>
    {% for post in post_list %}
    <article>
        <h2><a href="{% url 'blog:post-detail' post.pk %}">{{ post.title }}</a></h2>
        <p>{{ post.content|truncatewords:30 }}</p>
        <small>{{ post.created_time }}</small>
    </article>
    {% endfor %}
</body>
</html>
